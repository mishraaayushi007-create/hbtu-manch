<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="HBTU Manch PWA Icon - Calligraphy Edition">
  <defs>
    
    <linearGradient id="terracottaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DC6D44" />
      <stop offset="55%" stop-color="#C85A32" />
      <stop offset="100%" stop-color="#9A3B19" />
    </linearGradient>

    
    <radialGradient id="topSheen" cx="32%" cy="22%" r="72%">
      <stop offset="0%" stop-color="#FFFDF9" stop-opacity="0.24" />
      <stop offset="100%" stop-color="#9A3B19" stop-opacity="0" />
    </radialGradient>

    
    <linearGradient id="yellowSparkle" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#FFF38A" />
      <stop offset="50%" stop-color="#FFD12E" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    
    <filter id="calligraphyShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#581D08" flood-opacity="0.35" />
    </filter>

    
    <filter id="sparkleGlow" x="-45%" y="-45%" width="190%" height="190%">
      <feDropShadow dx="0" dy="0" stdDeviation="9" flood-color="#FFD12E" flood-opacity="0.7" />
    </filter>

    <style>
      

      .manch-calligraphy {
        font-family: 'Amita', 'Kalam', 'Kohinoor Devanagari', 'Nirmala UI', serif;
        font-weight: 700;
        fill: #FFFDF9;
        stroke: #FFFDF9;
        stroke-width: 2.2px;
        stroke-linejoin: round;
        paint-order: stroke fill;
      }

      .hbtu-label {
        font-family: 'Kalam', 'Amita', 'Nirmala UI', sans-serif;
        font-weight: 700;
        letter-spacing: 6px;
        fill: #FFF6EB;
      }
    </style>
  </defs>

  
  <rect x="24" y="24" width="464" height="464" rx="112" ry="112" fill="url(#terracottaBg)" />
  <rect x="24" y="24" width="464" height="464" rx="112" ry="112" fill="url(#topSheen)" />

  
  <rect x="48" y="48" width="416" height="416" rx="92" ry="92" fill="none" stroke="#FFFDF9" stroke-opacity="0.35" stroke-width="3" />

  
  <path d="M 112 332 C 145 215, 367 215, 400 332" fill="none" stroke="#FFFDF9" stroke-opacity="0.2" stroke-width="4" stroke-linecap="round" />

  
  <g filter="url(#calligraphyShadow)">
    <path d="M 124 338 Q 256 332 388 338" fill="none" stroke="#FFFDF9" stroke-width="6.5" stroke-linecap="round" />
    <path d="M 156 353 Q 256 349 356 353" fill="none" stroke="#FFFDF9" stroke-opacity="0.65" stroke-width="3" stroke-linecap="round" />
  </g>

  
  <text x="256" y="286" text-anchor="middle" font-size="140" class="manch-calligraphy" filter="url(#calligraphyShadow)">मंच</text>

  
  <text x="256" y="396" text-anchor="middle" font-size="34" class="hbtu-label">HBTU</text>

  
  <g transform="translate(380, 124)" filter="url(#sparkleGlow)">
    <path d="M 0 -44 C 5 -11, 11 -5, 44 0 C 11 5, 5 11, 0 44 C -5 11, -11 5, -44 0 C -11 -5, -5 -11, 0 -44 Z" fill="url(#yellowSparkle)" />
    <circle cx="0" cy="0" r="5.5" fill="#FFFDF9" fill-opacity="0.9" />
  </g>

  
  <g transform="translate(422, 180)" filter="url(#sparkleGlow)">
    <path d="M 0 -17 C 2 -4.5, 4.5 -2, 17 0 C 4.5 2, 2 4.5, 0 17 C -2 4.5, -4.5 2, -17 0 C -4.5 -2, -2 -4.5, 0 -17 Z" fill="#FFD12E" />
  </g>

  <g transform="translate(118, 142)">
    <path d="M 0 -14 C 2 -3.5, 3.5 -2, 14 0 C 3.5 2, 2 3.5, 0 14 C -2 3.5, -3.5 2, -14 0 C -3.5 -2, -2 -3.5, 0 -14 Z" fill="#FFE270" fill-opacity="0.92" />
  </g>
</svg>